[project]
name = "drakon-compute-engine"
version = "0.1.0"
description = "DRAKON Compute Engine — private FastAPI service for server-side scientific models. Reached only via a Vercel Service Binding from the Next.js 'web' service; has no public route (see /vercel.json)."
requires-python = ">=3.12"
dependencies = [
    "fastapi>=0.117.1",
    "pydantic>=2.9",
    "uvicorn[standard]>=0.32",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.3",
    "httpx>=0.27",
]

[tool.pytest.ini_options]
# Lets `pytest` (run with cwd=backend/) import `main` and `compute` the same
# way Vercel resolves the "main:app" entrypoint -- no src-layout indirection.
pythonpath = ["."]
