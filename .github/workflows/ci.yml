name: CI

# Plan §17 Phase 5: the golden-fixture parity tests (lib/*.goldenFixtures*.test.ts
# and backend/tests/test_*_golden_fixtures.py) and the baseline-integrity guard
# (lib/reentryModel.goldenFixtures.baseline.test.ts) only mean anything if they
# actually run on every change, not just when someone remembers to run them
# locally. This workflow is that enforcement -- it doesn't add new checks, it
# makes the ones already written in this branch non-optional.

on:
  push:
    branches: [main]
  pull_request:

jobs:
  test-typescript:
    name: TypeScript (Jest)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          # Full history, not the default shallow (depth 1) clone.
          # lib/reentryModel.goldenFixtures.baseline.test.ts regenerates
          # the golden fixture, which stamps baselineCommit via
          # `git log -1 -- <reference source files>` (see
          # scripts/generate-reentry-golden-fixtures.ts). With a shallow
          # clone there is no parent history to walk, so git can't
          # determine which commit last touched those files and instead
          # reports the current checkout's own commit -- which is a
          # different, wrong SHA on every single run (the PR's synthetic
          # merge commit, or whatever main/the branch tip happens to be at
          # checkout time), causing this test to fail nondeterministically
          # regardless of whether the reference model actually changed.
          # Reproduced locally with `git clone --depth 1` against the real
          # repo before applying this fix, and confirmed `fetch-depth: 0`
          # resolves it back to the correct, stable commit.
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm test

  test-python-compute-engine:
    name: Python (pytest) — DRAKON Compute Engine
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version-file: backend/.python-version
      - run: pip install -e ".[dev]"
      - run: pytest -v
